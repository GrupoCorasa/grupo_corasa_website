<!-- ✉️ Heriberto Ortega Gonzalez — Email Signature (Dart style) -->
<!-- Paste everything inside the <table> tag into your email client's HTML signature editor -->

<table
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="
    font-family: &quot;Courier New&quot;, Courier, monospace;
    font-size: 13px;
    line-height: 1.9;
    border-collapse: collapse;
  "
>
  <tr>
    <td>
      <!-- Terminal title bar -->
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="
          background-color: #2c2c2a;
          border-radius: 8px 8px 0 0;
          width: 100%;
        "
      >
        <tr>
          <td style="padding: 7px 14px">
            <span
              style="
                display: inline-block;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background-color: #e24b4a;
              "
            ></span>
            <span
              style="
                display: inline-block;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background-color: #ef9f27;
                margin-left: 5px;
              "
            ></span>
            <span
              style="
                display: inline-block;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background-color: #639922;
                margin-left: 5px;
              "
            ></span>
            <span style="color: #888780; font-size: 11px; margin-left: 10px"
              >signature.dart</span
            >
          </td>
        </tr>
      </table>
      <!-- Code body -->
      <table
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="
          background-color: #1e1e1e;
          border-radius: 0 0 8px 8px;
          width: 100%;
        "
      >
        <tr>
          <td style="padding: 16px 20px">
            <!-- Line: comment -->
            <div style="color: #6a6a6a; font-style: italic">
              // signature.dart
            </div>
            <!-- Line: class -->
            <div>
              <span style="color: #7f77dd">class </span>
              <span style="color: #378add">Developer </span>
              <span style="color: #888780">{</span>
            </div>
            <!-- name -->
            <div style="padding-left: 20px">
              <span style="color: #7f77dd">final </span>
              <span style="color: #378add">String </span>
              <span style="color: #e0e0e0">name </span>
              <span style="color: #888780">= </span>
              <span style="color: #1d9e75">'Heriberto Ortega Gonzalez'</span>
              <span style="color: #888780">;</span>
            </div>
            <!-- role -->
            <div style="padding-left: 20px">
              <span style="color: #7f77dd">final </span>
              <span style="color: #378add">String </span>
              <span style="color: #e0e0e0">role </span>
              <span style="color: #888780">= </span>
              <span style="color: #1d9e75">'Software Developer'</span>
              <span style="color: #888780">;</span>
            </div>
            <!-- phone -->
            <div style="padding-left: 20px">
              <span style="color: #7f77dd">final </span>
              <span style="color: #378add">String </span>
              <span style="color: #e0e0e0">phone </span>
              <span style="color: #888780">= </span>
              <span style="color: #1d9e75">'(662) 183 1587'</span>
              <span style="color: #888780">;</span>
            </div>
            <!-- closing brace -->
            <div><span style="color: #888780">}</span></div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
